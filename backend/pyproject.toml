[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Only `app` is an installable package. `api/` (Vercel entrypoint), `tests/`,
# `alembic/` and `scripts/` are top-level dirs but NOT packages to install —
# without this, setuptools flat-layout auto-discovery errors on multiple
# top-level packages and `pip install -e .` fails (e.g. on CI / Vercel).
include = ["app*"]

[project]
name = "wc-bet-tool-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "sqlalchemy>=2.0",
  "alembic>=1.13", "psycopg[binary]>=3.1", "pydantic>=2.6",
  "pydantic-settings>=2.2", "httpx>=0.27", "feedparser>=6.0",
  "numpy>=1.26", "scipy>=1.12", "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E701/E702: compact single-line conditionals are intentional in the numeric
# inner loops (Monte-Carlo, score matrix). E741: `l` reads as "line" in the
# totals/odds comprehensions.
ignore = ["E701", "E702", "E741"]
